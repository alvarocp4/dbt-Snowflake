name: dbt_mktv_project
version: 1.0.0
config-version: 2
profile: dbt_mktv_project
model-paths:
  - models
analysis-paths:
  - analyses
test-paths:
  - tests
seed-paths:
  - seeds
macro-paths:
  - macros
snapshot-paths:
  - snapshots
models:
  dbt_mktv_project:
    +persist_docs:
      relation: true
      columns: true
    sh_staging:
      +database: DB_MARKETING
      +schema: SH_STAGING
      +tags: staging
      +materialized: view
    sh_main:
      +database: DB_MARKETING
      +schema: SH_MAIN
      +tags: main
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: sync_all_columns
      +unique_key: ['id_prospect']
      +pre-hook:  "{{ control_carga_tablas('start') }}"
      +post-hook: "{{ control_carga_tablas('end') }}"
  elementary:
    +database: DB_MARKETING
    +schema: SH_STAGING
    +tags: elementary

on-run-end:
  - "{{ control_carga_tablas('cleanup') }}"