version: 2

models:
  - name: fact_mktv_visitas_trans
    description: "Tabla con los datos de CREA y FOTO"
    config:
      tags: [sh_main, yukon]
    columns:
      - name: opportunity_number
        description: "Identificador único de la Oportunidad"
        tests:
          - not_null
          - unique
